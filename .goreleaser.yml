version: 2

builds:
  - main: ./cmd/headless-cognito
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

brews:
  - repository:
      owner: mrtimp
      name: homebrew-formulas
    directory: Formula
    homepage: "https://github.com/mrtimp/headless-cognito"
    description: "Authenticate through an AWS ALB Cognito action and export the session cookies"
    commit_author:
      name: mrtimp
      email: timp@unfuddle.nz
