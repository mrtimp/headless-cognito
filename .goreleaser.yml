version: 2

builds:
  - main: ./cmd/headless-cognito
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

homebrew_casks:
  - repository:
      owner: mrtimp
      name: homebrew-formulas
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/mrtimp/headless-cognito"
    description: "Authenticate through an AWS ALB Cognito action and export the session cookies"
    commit_author:
      name: mrtimp
      email: timp@unfuddle.nz
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/headless-cognito"]
          end
